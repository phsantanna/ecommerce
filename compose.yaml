services:
  postgres-db:
    image: 'postgres:18.4-alpine'
    env_file:
      - .env
    environment:
      - 'POSTGRES_DB=${JDBC_DATABASE_DB}'
      - 'POSTGRES_PASSWORD=${JDBC_DATABASE_PASSWORD}'
      - 'POSTGRES_USER=${JDBC_DATABASE_USERNAME}'
    ports:
      - '${JDBC_DATABASE_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
